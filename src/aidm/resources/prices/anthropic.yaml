# Цены за миллион токенов, USD; сверено с https://platform.claude.com/docs/en/about-claude/pricing
as_of: "2026-11-08"
batch_multiplier: "0.5"
models:
  claude-opus-5-5:
    - input: "4"
      cache_write_5m: "5"
      cache_write_1h: "8"
      cache_read: "0.20"
      output: "20"
  claude-sonnet-5-5:
    - input: "2"
      cache_write_5m: "2.50"
      cache_write_1h: "4"
      cache_read: "0.10"
      output: "10"
  claude-haiku-5-5:
    - max_prompt_tokens: 100000
      input: "0.10"
      cache_write_5m: "0.125"
      cache_write_1h: "0.20"
      cache_read: "0.01"
      output: "0.50"
    - input: "0.50"
      cache_write_5m: "0.625"
      cache_write_1h: "1"
      cache_read: "0.05"
      output: "2.50"
